# Option B: run everything with Docker (or paste into Coolify as a Docker Compose app).
#   cp server/.env.example .env   # fill in values, then:
#   docker compose up -d --build
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: jobcards
      POSTGRES_USER: jobapp
      POSTGRES_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jobapp -d jobcards"]
      interval: 5s
      retries: 10

  api:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgres://jobapp:${DB_PASSWORD}@db:5432/jobcards
      SERVE_CLIENT: "true"
      UPLOAD_DIR: /app/uploads
    volumes:
      - uploads:/app/uploads
    ports:
      - "3000:3000"
    depends_on:
      db: { condition: service_healthy }

  worker:
    build: .
    restart: unless-stopped
    command: ["node", "src/worker.js"]
    env_file: .env
    environment:
      DATABASE_URL: postgres://jobapp:${DB_PASSWORD}@db:5432/jobcards
      AUTO_MIGRATE: "false"
    depends_on:
      api: { condition: service_started }

volumes:
  pgdata:
  uploads:
