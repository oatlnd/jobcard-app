# /etc/nginx/sites-available/jobs-staging  – the TEST SITE
# Installed by deploy/setup-staging.sh, which fills in the __PLACEHOLDERS__.
# Default: http://YOUR-VPS-IP:8080   (or a domain on port 80 if STAGING_DOMAIN is set)
# Password-protected so customers and search engines can't see it.
server {
    listen __PORT__;
    server_name __NAME__;

    root __DIR__/client/dist;
    index index.html;

    client_max_body_size 25m;

    auth_basic "Ratnam test site";
    auth_basic_user_file /etc/nginx/jobcard-staging.htpasswd;
    add_header X-Robots-Tag "noindex, nofollow" always;

    location / {
        try_files $uri /index.html;
    }

    location /assets/ {
        expires 1h;
    }

    # The app sends its own login token in the Authorization header, which replaces the
    # browser's test-site password - so the API skips the extra password (it has its own login).
    location /api/ {
        auth_basic off;
        proxy_pass http://127.0.0.1:3100;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 75s;
    }
}
