# /etc/nginx/sites-available/jobs
# Replace jobs.mobike360.com and /home/ramana if yours differ, then run certbot for HTTPS.
server {
    listen 80;
    server_name jobs.mobike360.com;

    root /home/ramana/jobcard-app/client/dist;
    index index.html;

    client_max_body_size 5m;

    # React app (client-side routing)
    location / {
        try_files $uri /index.html;
    }

    # Cache built assets for a long time (file names change on every build)
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # API + live updates (Socket.IO websockets)
    location /api/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 75s;
    }
}
